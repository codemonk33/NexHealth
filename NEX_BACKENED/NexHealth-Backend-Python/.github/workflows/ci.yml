name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  lint-and-security:
    name: Lint & Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bandit (Security Scan)
        run: |
          bandit -r app/ -s B105,B615

      - name: Run pip-audit (Dependency Auditing)
        # Run pip-audit to check for vulnerabilities, but make it non-blocking
        # for intern branches where they may not control requirements.txt.
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt

  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bionex_test
          POSTGRES_USER: bionex
          POSTGRES_PASSWORD: bionex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute pytest
        env:
          SECRET_KEY: "test-secret-key-must-be-at-least-32-characters-long"
          FIELD_ENCRYPTION_KEY: "zP2DkZp9161B1vQ4jS0e_P5T_n638F-oM55-kK64548="
          DEBUG: "True"
          TEST_DATABASE_URL: "postgresql://bionex:bionex@localhost:5432/bionex_test"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          pytest

  docker-build:
    name: Validate Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t bionex-backend:latest .
